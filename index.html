<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phénix — Mon suivi</title>
<meta name="description" content="Ton suivi quotidien de la méthode Phénix.">
<meta name="theme-color" content="#FDFFFB">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phénix">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img class="logo" src="icons/logo-96.png" alt="" width="44" height="44">
  <div class="hello">
    <div class="hello-name" id="hello">Bonjour</div>
    <div class="hello-sub" id="sync">Méthode Phénix</div>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs">
  <button data-tab="jour" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span>Ma journée</span>
  </button>
  <button data-tab="progres">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/></svg>
    <span>Progression</span>
  </button>
  <button data-tab="parcours">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 3.5L16 11H5"/></svg>
    <span>Parcours</span>
  </button>
  <button data-tab="outils">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h1M12 12h1M15.5 12h0M8.5 16h1M12 16h1M15.5 16h0"/></svg>
    <span>Outils</span>
  </button>
  <button data-tab="reperes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
    <span>Repères</span>
  </button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
